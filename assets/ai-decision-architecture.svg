<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Context-aware AI decision assistant architecture</title><desc id="desc">Structured and unstructured inputs are reconciled in a trusted source of truth. A context-aware AI assistant applies rules to produce explainable recommendations, which people review and correct. Corrections feed back to data and rules. The current prototype combines ChatGPT, Google Sheets, and human review; autonomous synchronization and execution are future phases.</desc>
<defs><style>.heading{font:700 25px system-ui,sans-serif;fill:#15363a}.body{font:17px system-ui,sans-serif;fill:#496266}.sm{font:600 14px system-ui,sans-serif;fill:#a54c2c;letter-spacing:1.5px}.tiny{font:16px system-ui,sans-serif;fill:#45615f}.white{fill:#fff}.line{stroke:#75968d;stroke-width:3;fill:none}.arrow{fill:#75968d}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#75968d"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b75c3b"/></marker></defs>
<rect width="1200" height="650" rx="22" fill="#f5f7f3"/>
<text x="38" y="48" font="750 31px system-ui,sans-serif" fill="#15363a">How the AI decision assistant works</text>
<text x="38" y="79" font="18px system-ui,sans-serif" fill="#52666a">From fragmented inputs to explainable decisions—with a trusted state layer and human feedback</text>
<g><rect x="36" y="130" width="244" height="302" rx="18" fill="#fff" stroke="#d7e3dc" stroke-width="2"/><text x="60" y="166" class="sm">01 / MULTIPLE INPUTS</text><text x="60" y="210" class="heading">Collect signals</text><text x="60" y="254" class="body">Structured records</text><text x="60" y="291" class="body">Images &amp; documents</text><text x="60" y="328" class="body">Expert guidelines</text><text x="60" y="365" class="body">Preferences &amp; context</text><path d="M58 392H257" stroke="#dce4de" stroke-width="2"/><text x="60" y="414" font="14px system-ui" fill="#52666a">Different formats and freshness</text></g>
<g><rect x="328" y="118" width="252" height="326" rx="18" fill="#e9efe7" stroke="#829c84" stroke-width="3"/><text x="350" y="156" class="sm">02 / STATE &amp; RELIABILITY</text><text x="350" y="200" class="heading">Source of truth</text><text x="350" y="233" font="700 18px system-ui" fill="#35564c">Reconcile what is current</text><text x="350" y="278" class="body">Editable master records</text><text x="350" y="315" class="body">Explicit statuses</text><text x="350" y="352" class="body">Source references</text><text x="350" y="389" class="body">Uncertainty flags</text><text x="350" y="420" font="700 14px system-ui" fill="#46694f">FOUNDATIONAL PRODUCT DECISION</text></g>
<g><rect x="629" y="130" width="244" height="302" rx="18" fill="#fff" stroke="#d7e3dc" stroke-width="2"/><text x="650" y="166" class="sm">03 / AI + RULES</text><text x="650" y="210" class="heading">Apply context</text><text x="650" y="254" class="body">Reusable guidance</text><text x="650" y="291" class="body">User preferences</text><text x="650" y="328" class="body">Current constraints</text><text x="650" y="365" class="body">Option evaluation</text><path d="M650 392H850" stroke="#dce4de" stroke-width="2"/><text x="650" y="414" font="14px system-ui" fill="#52666a">ChatGPT-assisted reasoning</text></g>
<g><rect x="920" y="130" width="244" height="302" rx="18" fill="#fff" stroke="#d7e3dc" stroke-width="2"/><text x="942" y="166" class="sm">04 / DECISION SUPPORT</text><text x="942" y="210" class="heading">Recommend</text><text x="942" y="254" class="body">Concrete options</text><text x="942" y="291" class="body">Clear rationale</text><text x="942" y="328" class="body">Visual comparison</text><text x="942" y="365" class="body">Human approval</text><path d="M941 392H1141" stroke="#dce4de" stroke-width="2"/><text x="942" y="414" font="14px system-ui" fill="#52666a">No autonomous execution</text></g>
<path d="M282 286H323M583 286H624M875 286H915" class="line" marker-end="url(#arr)"/>
<path d="M1042 440V489Q1042 506 1025 506H467Q450 506 450 489V450" fill="none" stroke="#b75c3b" stroke-width="3.3" marker-end="url(#arr2)"/>
<rect x="581" y="478" width="320" height="52" rx="13" fill="#fff2ea" stroke="#dcaa8f" stroke-width="1.5"/><text x="603" y="500" font="700 17px system-ui" fill="#8b4d32">Human feedback loop</text><text x="603" y="520" font="15px system-ui" fill="#705b50">Correct records, rules, and preferences</text>
<rect x="36" y="563" width="557" height="56" rx="12" fill="#e4ede5"/><circle cx="60" cy="591" r="9" fill="#65866c"/><text x="80" y="586" font="700 16px system-ui" fill="#15363a">Implemented prototype</text><text x="80" y="606" font="15px system-ui" fill="#496266">ChatGPT + Google Sheets + manual review and iteration</text>
<rect x="612" y="563" width="552" height="56" rx="12" fill="#fff" stroke="#9ab2a6" stroke-dasharray="6 5" stroke-width="2"/><circle cx="637" cy="591" r="9" fill="#fff" stroke="#75968d" stroke-width="2"/><text x="657" y="586" font="700 16px system-ui" fill="#15363a">Future phase — not yet implemented</text><text x="657" y="606" font="15px system-ui" fill="#496266">Automated retrieval, synchronization, and agentic actions</text>
</svg>