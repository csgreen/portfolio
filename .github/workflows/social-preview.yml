name: Build social preview image
on:
  push:
    paths:
      - '.github/workflows/social-preview.yml'
      - 'scripts/build_social_preview.py'
      - 'assets/christina-portrait-hq.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/build_social_preview.py
      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate social sharing preview with portrait"
            git push
          fi
